syntax = "proto3";

package proteinforge.reference.v1;

import "google/protobuf/timestamp.proto";

// Public UniProt annotations through the API. Only the text query or accession is sent
// to UniProt; the caller's token never leaves the API and no editor sequence is sent.
// Requires a valid bearer token (UNAUTHENTICATED otherwise).
//
// Error codes: INVALID_ARGUMENT (query syntax or accession format), NOT_FOUND (unknown entry),
// UNAVAILABLE / DEADLINE_EXCEEDED (UniProt limited or unreachable).
// Equivalent REST routes: GET /v1/uniprot/search and GET /v1/uniprot/{accession}.
service ReferenceService {
  // At most ten summaries, reviewed entries first as UniProt orders them.
  rpc SearchEntries(SearchEntriesRequest) returns (SearchEntriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Explicit SIFTS residues for one exact UniProt sequence version. Authenticated,
  // shares the reference request budget. No sequence or caller identity reaches providers.
  // A complete response must fit 2,000,000 bytes; never silently truncates rows.
  rpc GetResidueMapping(GetResidueMappingRequest) returns (GetResidueMappingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message EntrySummary {
  // UniProt accession.
  string accession = 1;
  string name = 2;
  string organism = 3;
  // Swiss-Prot (true) or TrEMBL (false).
  bool reviewed = 4;
  // Residues; 1–100,000.
  int32 length = 5;
}

// Experimental structure cross-referenced by the entry.
message PdbReference {
  // PDB id, for example "1TRZ".
  string id = 1;
  // As annotated, for example "X-ray".
  string method = 2;
  optional string resolution = 3;
  // Chain ranges, for example "A/C=90-110, B/D=25-54".
  optional string chains = 4;
}

message Entry {
  EntrySummary summary = 1;
  string sequence = 2;
  int32 entry_version = 3;
  int32 sequence_version = 4;
  google.protobuf.Timestamp retrieve_time = 5;
  // Functional annotation in the source language; absent when UniProt has none.
  optional string function = 6;
  repeated PdbReference structures = 7;
}

message SearchEntriesRequest {
  // 2–200 characters of UniProt query syntax, for example "accession:P01308".
  string query = 1;
}

message SearchEntriesResponse {
  repeated EntrySummary entries = 1;
  // Maximum returned per search.
  int32 limit = 2;
  // True when UniProt had more matches than `limit`.
  bool truncated = 3;
  google.protobuf.Timestamp retrieve_time = 4;
}

message GetEntryRequest {
  string accession = 1;
}

message GetEntryResponse {
  Entry entry = 1;
}

message GetResidueMappingRequest {
  string pdb_id = 1;
  string accession = 2;
  int32 sequence_version = 3;
}

message ResidueMappingProvenance {
  string provider = 1;
  string xml_url = 2;
  string residue_listing_url = 3;
  string retrieved_at = 4;
  string release_date = 5;
}

message ResidueMappingRow {
  string entity_id = 1;
  string label_asym_id = 2;
  string auth_asym_id = 3;
  int32 label_seq_id = 4;
  optional string auth_seq_id = 5;
  string insertion_code = 6;
  string segment_id = 7;
  string accession = 8;
  int32 position = 9;
  string residue = 10;
  bool not_observed = 11;
}

message ResidueMappingDocument {
  int32 version = 1;
  string pdb_id = 2;
  ResidueMappingProvenance provenance = 3;
  repeated ResidueMappingRow rows = 4;
}

message GetResidueMappingResponse {
  ResidueMappingDocument mapping = 1;
  int32 reference_sequence_version = 2;
  // SHA-256 of the entire exact uppercase ASCII sequence, without spaces.
  string reference_sequence_sha256 = 3;
}
