# Lint configuration. Kept out of pyproject.toml: Vercel reads that file as the dependency manifest, and
# dependencies stay pinned in requirements*.txt.
target-version = "py313"
# Generated by buf; its currency is checked separately in CI.
extend-exclude = ["app/rpc/gen", "tmp", "artifacts"]

[lint]
# Syntax errors, pyflakes and bugbear: likely bugs, not layout. The compact one-line style is intentional.
select = ["E9", "F", "B"]

[lint.flake8-bugbear]
# Frozen dataclass: a shared default instance cannot be mutated.
extend-immutable-calls = ["app.sifts.SourceLimits"]

[lint.per-file-ignores]
# Test handlers and lambdas are built and consumed inside the same loop iteration.
"tests/*" = ["B023"]
