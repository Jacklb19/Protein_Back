name: Deployment check

# Every six hours (off the hour, when GitHub's scheduler is less busy) and on demand. Schedules run only
# from the default branch, so this starts once the file reaches main. No secrets: both requests are public.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check health and an anonymous database read
        # Fails when /v1/health is not 200 ok or POST /v1/shared with an invented token is not 404.
        run: python scripts/check_deployment.py https://protein-back.vercel.app
