name: Backend verification

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint protobuf contracts
        run: npx --yes @bufbuild/buf@1.73.0 lint
      - name: Check generated RPC code is current
        run: |
          npx --yes @bufbuild/buf@1.73.0 generate
          git add --intent-to-add app/rpc/gen
          git diff --exit-code app/rpc/gen
      - name: Run API and migration tests
        run: python -m unittest discover -s tests -v
