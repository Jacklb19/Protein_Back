name: Backend verification

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

jobs:
  verify:
    runs-on: ubuntu-latest
    # Disposable cluster for the SQL/RLS tests; tests/test_postgres.py only accepts loopback /pf_security_test.
    services:
      postgres:
        image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
        env:
          POSTGRES_DB: pf_security_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pf_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PF_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/pf_security_test
      PF_PSQL: psql
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: python -m ruff check .
      - name: Lint protobuf contracts
        run: npx --yes @bufbuild/buf@1.73.0 lint
      - name: Check generated RPC code is current
        run: |
          npx --yes @bufbuild/buf@1.73.0 generate
          git add --intent-to-add app/rpc/gen
          git diff --exit-code app/rpc/gen
      - name: Apply migrations to the disposable database
        # Same order as scripts/test-postgres.ps1: emulated auth bootstrap, then every migration by name.
        run: |
          psql --version
          psql "$PF_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/postgres_bootstrap.sql
          for migration in $(ls supabase/migrations/*.sql | sort); do
            psql "$PF_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run API, migration and PostgreSQL tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Check coverage threshold
        run: python -m coverage report
